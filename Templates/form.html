<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Форма ввода данных</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Проект HH/GitHub</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="form.html">Форма</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacts.html">Контакты</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h1>Форма для ввода данных</h1>
        <form>
            <div class="mb-3">
                <label for="jobTitle" class="form-label">Название вакансии</label>
                <input type="text" class="form-control" id="jobTitle" placeholder="Введите название вакансии">
            </div>
            <div class="mb-3">
                <label for="city" class="form-label">Город</label>
                <input type="text" class="form-control" id="city" placeholder="Введите город">
            </div>
            <div class="mb-3">
                <label for="experience" class="form-label">Опыт работы</label>
                <select class="form-select" id="experience">
                    <option selected>Выберите...</option>
                    <option value="1">Без опыта</option>
                    <option value="2">1-3 года</option>
                    <option value="3">Более 3 лет</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
    </div>
</body>
</html>
