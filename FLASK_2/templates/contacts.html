<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <header>
        <h1>{{ title }}</h1>
        <nav>
            <a href="/">Главная</a>
            <a href="/contacts">Контакты</a>
            <a href="/form">Форма поиска</a>
            <a href="/add_contact">Добавить контакт</a> <!-- Добавлен новый пункт -->
        </nav>
    </header>

    <section>
        <h2>Контактная информация</h2>
        <table>
            <tr>
                <th>Имя</th>
                <th>Email</th>
                <th>Телефон</th>
            </tr>
            {% for contact in contacts %}
                <tr>
                    <td>{{ contact[1] }}</td>
                    <td>{{ contact[2] }}</td>
                    <td>{{ contact[3] }}</td>
                </tr>
            {% endfor %}
        </table>
    </section>

    <footer>
        <p>&copy; 2025 Ваш сайт</p>
    </footer>
</body>
</html>
